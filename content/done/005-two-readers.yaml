id: "005-two-readers"
voice: ashley
title: "자소서를 꼭 두 사람이 봐야 하는 이유"
description: "익숙한 눈에는 안 보이는 어색함이 있어요. 첨삭은 두 명의 어른이 함께. 하이애비뉴 애슐리박 원장T #shorts #자소서 #특목고자소서 #자기소개서"
tags: [자소서, 자기소개서, 특목고 자소서, 외고 자소서, 자소서 첨삭, 고입 자소서, 국제고 자소서, 하이애비뉴, 애슐리박]
clip_description: "내 눈엔 자연스러운데 남이 보면 이상한 문장이 있어요. 자소서는 두 사람이 봐야 하는 이유. 하이애비뉴 애슐리박 원장T"
clip_tags: [자소서, 자기소개서, 특목고자소서, 자소서첨삭, 하이애비뉴]
outro_say: "하이애비뉴 애슐리박이었습니다."
cards:
  - lines: ["9년 해도", "자소서는", "*혼자 안 봐요*"]
    say: "자소서 첨삭을 9년 했지만, 저는 지금도 혼자 보지 않아요."
  - head: "항상 두 명의 어른이 봐요"
    lines: ["왜냐하면"]
    say: "항상 두 명의 어른이 함께 봐요. 왜냐하면,"
  - lines: ["내가 못 느끼는 걸", "다른 사람은", "*이상하다고*", "*느낄 수 있거든요*"]
    say: "내가 못 느끼는 어색함을, 다른 사람은 바로 이상하다고 느낄 수 있거든요."
  - lines: ["한 사람의 어휘는", "*생각보다*", "*한정적이에요*"]
    say: "그리고 한 사람이 쓰는 어휘는 생각보다 한정적이에요."
  - lines: ["오래 본 글일수록", "*익숙해서*", "*안 보여요*"]
    say: "오래 들여다본 글일수록 익숙해서 오히려 안 보여요."
  - head: "집에서 할 수 있는 방법"
    lines: ["소리 내서", "*다른 사람에게*", "*읽어주기*"]
    say: "집에서는 자소서를 소리 내서 다른 사람에게 읽어주세요. 걸리는 부분이 바로 보여요."

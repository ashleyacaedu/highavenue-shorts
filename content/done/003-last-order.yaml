id: "003-last-order"
voice: ashley
title: "면접 마지막 순서라면 꼭 기억하세요"
description: "면접관이 지쳐 있을 수도, 예상 못 한 질문이 나올 수도 있어요. 그래도 끝까지. 하이애비뉴 애슐리박 원장T #shorts #특목고면접 #외고면접"
tags: [특목고면접, 외고면접, 국제고면접, 면접 순서, 면접 마인드, 고입면접, 면접팁, 하이애비뉴, 애슐리박]
clip_description: "면접 마지막 순서, 예상 못 한 질문. 어떤 상황이 와도 끝까지 최선을. 하이애비뉴 애슐리박 원장T"
clip_tags: [특목고면접, 외고면접, 면접팁, 면접마인드, 하이애비뉴]
outro_say: "하이애비뉴 애슐리박이었습니다."
cards:
  - lines: ["정말 잘하던", "아이가", "*떨어진 적이 있어요*"]
    say: "정말 잘하던 아이가 떨어진 적이 있어요."
  - head: "그날 그 아이는"
    lines: ["면접", "*마지막 순서*"]
    say: "그날 그 아이는 면접 마지막 순서였어요."
  - lines: ["면접관은", "*지칠 대로*", "*지쳐 있었고*"]
    say: "면접관 선생님들은 지칠 대로 지쳐 있었고,"
  - lines: ["질문도", "*예상 밖이었대요*"]
    say: "질문도 예상 밖이었다고 하더라고요."
  - lines: ["내가 고를 수 없는", "*변수는*", "*항상 있어요*"]
    say: "순서도, 질문도, 면접관의 컨디션도, 내가 고를 수 없는 변수예요."
  - lines: ["그래서 지금은", "꼭 이렇게", "*말해줘요*"]
    say: "그래서 지금은 아이들한테 꼭 이렇게 말해줘요."
  - lines: ["어떤 상황이 와도", "*끝까지*", "*최선을 다하자*"]
    say: "어떤 상황이 와도, 마지막 문장까지 최선을 다하자."

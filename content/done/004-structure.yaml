id: "004-structure"
voice: narrator
title: "면접 답변, 이 순서로만 말해도 달라져요"
description: "결론 → 이유 → 내 경험 → 다시 결론. 두괄식 답변 구조 하나면 충분해요. 하이애비뉴 애슐리박 원장T #shorts #면접팁 #특목고면접 #외고면접"
tags: [면접팁, 면접 답변 구조, 두괄식, 특목고면접, 외고면접, 국제고면접, 자사고면접, 하이애비뉴, 애슐리박]
clip_description: "결론, 이유, 경험, 다시 결론. 면접 답변은 이 순서 하나로 정리돼요. 하이애비뉴 애슐리박 원장T"
clip_tags: [면접팁, 두괄식, 특목고면접, 외고면접, 하이애비뉴]
cards:
  - lines: ["면접 답변", "*이 순서로만*", "말해보세요"]
    say: "면접 답변, 이 순서로만 말해보세요."
  - head: "1단계"
    lines: ["*결론 한 문장*"]
    say: "첫째, 결론을 한 문장으로 먼저 말해요."
  - head: "2단계"
    lines: ["*왜 그렇게*", "*생각하는지*"]
    say: "둘째, 왜 그렇게 생각하는지 이유를 붙여요."
  - head: "3단계"
    lines: ["*내 경험*", "하나만"]
    say: "셋째, 그걸 보여주는 내 경험을 딱 하나만 말해요."
  - head: "4단계"
    lines: ["*다시 결론*", "짧게"]
    say: "마지막으로, 처음 결론을 짧게 한 번 더 말하고 끝내요."
  - lines: ["경험부터 꺼내면", "*요지가*", "*흐려져요*"]
    say: "경험부터 길게 꺼내면, 듣는 사람은 요지를 놓쳐요."
  - lines: ["결론부터", "말하는 연습", "*오늘부터*"]
    say: "결론부터 말하는 연습, 오늘부터 해보세요."

id: "001-voice"
voice: ashley
title: "면접 내용이 완벽해도 떨어지는 이유 | 특목고 면접"
description: "9년 면접 현장에서 본 것. 목소리가 작거나 요지를 벗어나면 끝! 첫 문장에 결론부터. 하이애비뉴 애슐리박 원장T #shorts #특목고면접 #외고면접"
tags: [특목고면접, 외고면접, 국제고면접, 면접팁, 면접 목소리, 면접 두괄식, 고입면접, 하이애비뉴, 애슐리박]
clip_description: "내용이 완벽해도 떨어지는 아이가 있어요. 목소리, 그리고 질문의 요지. 하이애비뉴 애슐리박 원장T"
clip_tags: [특목고면접, 외고면접, 국제고면접, 면접팁, 하이애비뉴]
outro_say: "하이애비뉴 애슐리박이었습니다."
cards:
  - lines: ["내용이 완벽해도", "떨어지는 아이가", "*있습니다*"]
    say: "면접 내용이 완벽해도 떨어지는 아이가 있어요."
  - head: "9년 동안 면접장 앞에서 본 것"
    lines: ["이유 첫 번째", "*목소리*"]
    say: "첫 번째 이유는 목소리예요."
  - lines: ["작고 기어들어가는", "목소리는", "면접관에게", "*닿지 않아요*"]
    say: "목소리가 작고 기어들어가면, 면접관에게 닿지를 않아요."
  - lines: ["전달이 안 되면", "아무리 좋은 내용도", "*의미가 없습니다*"]
    say: "전달이 안 되면, 아무리 좋은 내용도 의미가 없어요."
  - lines: ["이유 두 번째", "*질문 요지를*", "*벗어난 답변*"]
    say: "두 번째는, 질문의 요지를 벗어난 답변이에요."
  - head: "면접관 머릿속"
    lines: ["\"그래서", "*무슨 말이지?\"*"]
    say: "면접관 머릿속에는 이 생각만 남아요. 그래서 무슨 말이지?"
  - head: "외고·국제고 면접은 짧습니다"
    lines: ["첫 문장에", "*결론부터*", "*두괄식*"]
    say: "외고, 국제고 면접은 길지 않아요. 첫 문장에 결론부터 말하세요."
  - lines: ["들리게 말하고", "묻는 말에", "*먼저 답하세요*"]
    say: "들리게 말하고, 묻는 말에 먼저 답하세요."

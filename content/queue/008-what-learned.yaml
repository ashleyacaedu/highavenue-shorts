id: "008-what-learned"
voice: narrator
title: "자소서, 활동 나열하면 안 되는 이유"
description: "무엇을 했는지보다 그 과정에서 생각이 어떻게 바뀌었는지. 자소서의 핵심이에요. 하이애비뉴 애슐리박 원장T #shorts #자소서 #특목고자소서"
tags: [자소서, 자기소개서, 자소서 쓰는법, 특목고 자소서, 외고 자소서, 국제고 자소서, 고입 자소서, 하이애비뉴, 애슐리박]
clip_description: "자소서에 활동만 줄줄이 쓰고 있다면? 중요한 건 그 과정에서 내 생각이 어떻게 바뀌었는지예요. 하이애비뉴 애슐리박 원장T"
clip_tags: [자소서, 자기소개서, 특목고자소서, 자소서쓰는법, 하이애비뉴]
cards:
  - lines: ["자소서에", "활동만", "*줄줄이?*"]
    say: "자소서에 활동만 줄줄이 쓰고 있나요?"
  - lines: ["\"~을 했다\"", "\"~에 참여했다\"", "*이건 기록이에요*"]
    say: "무엇을 했다, 무엇에 참여했다. 이건 자소서가 아니라 기록이에요."
  - head: "읽는 사람이 궁금한 건"
    lines: ["그래서", "*너는 어떻게*", "*달라졌는데?*"]
    say: "읽는 사람이 궁금한 건 이거예요. 그래서 너는 어떻게 달라졌는데?"
  - lines: ["활동은 줄이고", "*생각의 변화*", "를 늘리세요"]
    say: "활동은 줄이고, 그 과정에서 생긴 생각의 변화를 늘리세요."
  - head: "스스로 물어보기"
    lines: ["처음엔 어떻게", "생각했고", "*지금은?*"]
    say: "처음에는 어떻게 생각했는지, 지금은 어떻게 생각하는지 스스로 물어보세요."
  - lines: ["그 차이가", "*나만의*", "*이야기예요*"]
    say: "그 차이가 바로, 다른 지원자와 겹치지 않는 나만의 이야기예요."

id: "009-length"
voice: narrator
title: "면접 답변, 길게 말하면 손해예요"
description: "길게 말한다고 점수가 오르지 않아요. 핵심만 말하고 다음 질문을 기다리세요. 하이애비뉴 애슐리박 원장T #shorts #면접팁 #특목고면접 #외고면접"
tags: [면접팁, 면접 답변 길이, 특목고면접, 외고면접, 국제고면접, 자사고면접, 고입면접, 하이애비뉴, 애슐리박]
clip_description: "면접에서 길게 말할수록 좋다? 아니에요. 핵심만 말하고 멈추는 것도 실력이에요. 하이애비뉴 애슐리박 원장T"
clip_tags: [면접팁, 특목고면접, 외고면접, 면접답변, 하이애비뉴]
cards:
  - lines: ["면접에서", "*길게 말하면*", "유리할까요?"]
    say: "면접에서 길게 말하면 유리할까요?"
  - lines: ["*아니에요*"]
    say: "아니에요."
  - lines: ["길어질수록", "*핵심이*", "*묻혀요*"]
    say: "말이 길어질수록, 정작 하고 싶은 핵심이 묻혀요."
  - lines: ["면접 시간은", "*정해져 있어요*"]
    say: "면접 시간은 정해져 있어요. 한 답변이 길면, 다른 질문을 받을 기회가 줄어요."
  - lines: ["핵심만 말하고", "*멈추는 것*", "도 실력"]
    say: "핵심만 말하고 멈추는 것도 실력이에요."
  - lines: ["궁금하면", "면접관이", "*다시 물어봐요*"]
    say: "더 궁금하면, 면접관이 다시 물어봐요. 그게 오히려 좋은 신호예요."

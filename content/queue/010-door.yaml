id: "010-door"
voice: ashley
title: "면접은 문을 여는 순간 시작돼요"
description: "첫 질문 전에 이미 인상은 정해져요. 인사, 시선, 앉는 자세까지가 면접. 하이애비뉴 애슐리박 원장T #shorts #면접태도 #특목고면접 #외고면접"
tags: [면접태도, 면접 인사, 면접 첫인상, 특목고면접, 외고면접, 국제고면접, 고입면접, 하이애비뉴, 애슐리박]
clip_description: "면접은 첫 질문이 아니라 문을 여는 순간 시작돼요. 인사, 시선, 자세까지가 면접이에요. 하이애비뉴 애슐리박 원장T"
clip_tags: [면접태도, 면접첫인상, 특목고면접, 외고면접, 하이애비뉴]
outro_say: "하이애비뉴 애슐리박이었습니다."
cards:
  - lines: ["면접은", "*문을 여는 순간*", "시작돼요"]
    say: "면접은 첫 질문이 아니라, 문을 여는 순간 시작돼요."
  - head: "첫 번째"
    lines: ["*들리게*", "인사하기"]
    say: "첫 번째, 들리게 인사하세요. 목소리는 여기서부터예요."
  - head: "두 번째"
    lines: ["면접관과", "*눈 맞추기*"]
    say: "두 번째, 면접관 선생님과 눈을 맞추세요."
  - head: "세 번째"
    lines: ["허리 펴고", "*손은 무릎 위*"]
    say: "세 번째, 앉을 때는 허리를 펴고 손은 무릎 위에."
  - lines: ["답을 다 하고도", "*표정 유지*"]
    say: "답변이 끝나도 표정을 유지하세요. 아쉬워하는 표정, 다 보여요."
  - lines: ["나갈 때 인사까지", "*면접이에요*"]
    say: "나갈 때 인사까지가 면접이에요."

id: "006-unexpected"
voice: narrator
title: "면접에서 예상 못 한 질문이 나왔을 때"
description: "당황해서 아무 말이나 시작하면 요지가 흐려져요. 잠깐 정리하고 결론부터. 하이애비뉴 애슐리박 원장T #shorts #면접팁 #특목고면접 #외고면접"
tags: [면접팁, 예상 못한 질문, 면접 당황, 특목고면접, 외고면접, 국제고면접, 고입면접, 하이애비뉴, 애슐리박]
clip_description: "면접에서 처음 듣는 질문이 나왔다면? 당황해서 말부터 시작하지 말고 잠깐 정리하고 결론부터. 하이애비뉴 애슐리박 원장T"
clip_tags: [면접팁, 특목고면접, 외고면접, 면접질문, 하이애비뉴]
cards:
  - lines: ["처음 듣는", "질문이", "*나왔다면?*"]
    say: "면접에서 처음 듣는 질문이 나왔다면?"
  - lines: ["제일 위험한 건", "*아무 말이나*", "*시작하는 것*"]
    say: "제일 위험한 건, 당황해서 아무 말이나 시작하는 거예요."
  - lines: ["말하면서 생각하면", "*요지가*", "*흐려져요*"]
    say: "말하면서 생각하면, 답이 점점 질문에서 멀어져요."
  - head: "이렇게 해보세요"
    lines: ["\"잠시 생각해보고", "*말씀드리겠습니다\"*"]
    say: "잠시 생각해보고 말씀드리겠습니다. 이렇게 말하고 정리할 시간을 가져도 괜찮아요."
  - lines: ["그리고", "첫 문장은", "*결론부터*"]
    say: "그리고 첫 문장은 무조건 결론부터."
  - lines: ["완벽한 답보다", "*정리된 답*"]
    say: "면접관이 보는 건 완벽한 답보다, 정리된 생각이에요."

id: "007-recording"
voice: ashley
title: "면접 연습, 꼭 영상으로 찍어보세요"
description: "내 습관은 내 눈에 안 보여요. 찍어서 다시 보면 시선·손·말끝이 보여요. 하이애비뉴 애슐리박 원장T #shorts #면접연습 #특목고면접 #외고면접"
tags: [면접연습, 면접 영상, 모의면접, 특목고면접, 외고면접, 국제고면접, 면접 태도, 하이애비뉴, 애슐리박]
clip_description: "면접 연습은 꼭 영상으로! 찍어서 다시 보면 시선, 손, 말끝 습관이 보여요. 하이애비뉴 애슐리박 원장T"
clip_tags: [면접연습, 모의면접, 특목고면접, 면접태도, 하이애비뉴]
outro_say: "하이애비뉴 애슐리박이었습니다."
cards:
  - lines: ["면접 연습", "*꼭 영상으로*", "찍어보세요"]
    say: "면접 연습은 꼭 영상으로 찍어보세요."
  - lines: ["내 습관은", "*내 눈에*", "*안 보여요*"]
    say: "내 습관은 내 눈에 안 보이거든요."
  - head: "다시 보면 보이는 것 1"
    lines: ["*시선*", "어디를 보고 있는지"]
    say: "다시 보면, 내 시선이 어디를 향하는지 보여요."
  - head: "다시 보면 보이는 것 2"
    lines: ["*손*", "가만히 있는지"]
    say: "손을 만지작거리는지도 보이고요."
  - head: "다시 보면 보이는 것 3"
    lines: ["*말끝*", "흐려지는지"]
    say: "말끝이 흐려지는지도 바로 들려요."
  - lines: ["저희는", "*실제 면접처럼*", "녹화해요"]
    say: "그래서 저희 수업은 강의실을 면접장처럼 만들고 녹화해서 아이들한테 돌려줘요."
  - lines: ["한 번 보는 게", "*열 번 듣는 것보다*", "빨라요"]
    say: "한 번 직접 보는 게, 열 번 듣는 것보다 빨라요."

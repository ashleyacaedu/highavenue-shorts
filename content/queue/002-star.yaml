id: "002-star"
voice: ashley
title: "맞은 문제에도 별표를 치라고 하는 이유"
description: "찍어서 맞은 문제가 시험장에서 제일 위험해요. 헷갈렸으면 맞아도 별표! 하이애비뉴 애슐리박 원장T #shorts #공부법 #오답노트 #중등영어"
tags: [공부법, 오답노트, 중등공부법, 중학생 공부, 시험 공부법, 찍어서 맞은 문제, 특목고 준비, 하이애비뉴, 애슐리박]
clip_description: "찍어서 맞은 문제, 그냥 넘어가면 시험장에서 또 틀려요. 헷갈렸으면 맞아도 별표! 하이애비뉴 애슐리박 원장T"
clip_tags: [공부법, 오답노트, 중학생공부, 시험공부, 하이애비뉴]
outro_say: "하이애비뉴 애슐리박이었습니다."
cards:
  - lines: ["맞은 문제에도", "*별표를*", "*치라고 해요*"]
    say: "저는 아이들한테, 맞은 문제에도 별표를 치라고 해요."
  - head: "채점할 때 이것부터"
    lines: ["풀면서", "*헷갈렸던 문제*"]
    say: "풀면서 헷갈렸던 문제요."
  - lines: ["찍어서 맞은 건", "아는 게 아니라", "*운이었던 거예요*"]
    say: "찍어서 맞은 건, 아는 게 아니라 운이었던 거거든요."
  - head: "이런 경우 거의 확실해요"
    lines: ["같은 개념인데", "이건 맞고", "*저건 틀렸다면*"]
    say: "같은 개념인데 이 문제는 맞고 저 문제는 틀렸다면, 거의 확실해요."
  - lines: ["점수표에선", "넘어가지만", "*시험장에선*", "*제일 위험한 문제*"]
    say: "점수표에서는 그냥 넘어가지만, 시험장에서는 제일 위험한 문제예요."
  - lines: ["별표 친 문제는", "*오답노트에*", "*같이 넣기*"]
    say: "별표 친 문제는 틀린 문제랑 똑같이 오답노트에 넣으세요."
  - lines: ["\"나 이거", "*확실히 몰랐어\"*", "인정하는 연습"]
    say: "나 이거 확실히 몰랐어. 이걸 스스로 인정하는 게 진짜 공부의 시작이에요."
